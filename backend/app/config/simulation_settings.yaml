default_simulation_count: 10000
max_simulation_count: 50000
random_seed: null   # null = non-deterministic; set an int for reproducible runs

# Game-script scenario buckets and their approximate unconditional
# probabilities before conditioning on Vegas spread/total for a given game.
# These get re-weighted per game using the spread/total (see
# simulation/game_sim.py:scenario_probabilities).
game_scripts:
  - name: close_high_scoring
    base_probability: 0.18
  - name: home_blowout
    base_probability: 0.14
  - name: away_blowout
    base_probability: 0.14
  - name: low_scoring
    base_probability: 0.16
  - name: competitive_shootout
    base_probability: 0.20
  - name: defensive_game
    base_probability: 0.18

# Variance parameters for player-level simulation draws around the
# game-script-conditioned mean. Distribution family + coefficient of
# variation (stdev / mean) by position, used when we don't yet have
# enough historical data to fit an empirical distribution.
player_variance:
  QB:  {distribution: gamma, cv: 0.34}
  RB:  {distribution: gamma, cv: 0.48}
  WR:  {distribution: gamma, cv: 0.58}
  TE:  {distribution: gamma, cv: 0.62}
  K:   {distribution: gamma, cv: 0.45}
  DST: {distribution: gamma, cv: 0.65}

percentiles: [10, 25, 50, 75, 90, 95, 99]
salary_multiplier_targets: [3, 4, 5, 6]

# Contest-field simulation (simulation/field_sim.py) — scores a portfolio's
# lineups against a synthetic modeled field instead of the crude
# `prob_top5pct% - ownership%` proxy. Two honest approximations, not
# hidden: the field is built from OUR OWN ownership model, not real
# observed contest entries (DK doesn't expose those); and the payout
# curve is a top-heavy shape calibrated to a contest's REAL prize pool/
# entry count/entry fee when a specific dk_contest_id is known (from
# DraftKings' own lobby listing — data_sources/draftkings.py's
# get_nfl_contests, which does expose total_prizes/max_entries/entry_fee),
# or a generic assumed shape otherwise.
field_simulation:
  num_field_lineups: 3000     # synthetic opponent entries SAMPLED per build — a statistical sample used to estimate percentile placement, NOT the assumed real contest size (see default_max_entries). Bounds the finest resolvable percentile (~1-in-3,000) — win%/top1% are inherently coarser estimates than cash% for exactly this reason.
  max_sims_used: 2000         # subsamples the Monte Carlo draw matrix's simulation columns for cost control on a free-tier host
  cash_line_pct: 0.20         # fraction of the field assumed to cash — real DK cash lines vary by contest and aren't exposed via any known endpoint
  payout_shape_alpha: 2.5     # higher = payout concentrates more toward 1st place (typical large-field GPP shape)
  assumed_rake_pct: 0.15      # used only when a contest's real total_prizes isn't available (no dk_contest_id selected)
  min_ownership_weight_pct: 0.5  # floor so a player with no ownership projection isn't literally unpickable by the synthetic field
  default_max_entries: 10000  # assumed REAL contest size when no dk_contest_id's real max_entries is known — deliberately different from num_field_lineups (confirmed live: conflating the two reported a 59% win rate / 99.8% cash rate against what a real large-field GPP would never give)
